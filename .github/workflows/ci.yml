name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, test, build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      # Warnings are reported but not fatal: the crate has pre-existing style
      # lints (module inception in src/app/ui.rs and friends) that are
      # deliberate, not regressions.
      - name: Clippy
        run: cargo clippy --all-targets --locked

      - name: Test
        run: cargo test --no-fail-fast --locked

      - name: Build the release binary
        run: cargo build --release --locked

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: image-viewer-windows-x64
          path: target/release/image-viewer.exe
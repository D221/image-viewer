[package]
name = "image-viewer"
version = "0.1.0"
edition = "2024"
description = "A fast Windows desktop image viewer: the UI thread never decodes"
license = "MIT"
repository = "https://github.com/D221/image-viewer"
readme = "README.md"

[dependencies]
# **`default-features = false`, deliberately.** eframe's defaults pull in
# `wgpu` (via `egui-wgpu`), the Wayland and X11 platform features, and the web
# screen reader - none of which a Windows-only glow app compiles or runs. wgpu
# alone is `wgpu`, `wgpu-core`, `wgpu-hal`, `naga` and their D3D12/Vulkan
# backends: a large part of the build time for a renderer this app never
# creates a device on. `glow` is the renderer (`eframe::Renderer::Glow` in
# `main.rs`), `default_fonts` is the font egui draws with, and `accesskit` is
# the Windows screen-reader bridge. Dropping any of those three breaks the app
# in a way a build cannot catch; dropping `wgpu` is what this list is for.
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
] }
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "ico", "tiff", "qoi", "rayon"] }
# PNG stores its iCCP profile zlib-compressed. Already in the tree via `png`,
# pure Rust (miniz_oxide), so this adds no native code.
flate2 = "1"
# Used directly by the linear-light resampler: the box pre-reduction and both
# kernel passes are row-parallel and were the hottest loops in the viewer.
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rfd = "0.17.2"
nom-exif = "3.8.0"
turbojpeg = "1"
trash = "5"
open = "5"
jxl-oxide = { version = "0.12", features = ["image"] }
heic = { version = "0.1.6", features = ["av1", "parallel"] }
# Multi-page TIFF. `image` 0.25 wraps this crate but exposes no way to reach page
# 2 - `TiffDecoder` implements only `ImageDecoder`, whose `read_image` consumes
# the decoder, and it is not an `AnimationDecoder`. So depending on it directly is
# the only way to see a multi-page TIFF's other pages. It was already in the tree
# transitively, so this adds no new download and no new native code.
tiff = "0.11"
arboard = "3"
wallpaper = "3"
winreg = "0.56"
# Archives (`.cbz`/`.zip`) are stored or deflated in the real world; the
# exotic codecs (bzip2, lzma, zstd, AES) would only matter for archives this
# viewer cannot open for other reasons (no password UI), and each carries its
# own subtree. A member using one fails extraction with a clear error instead
# of dragging 30 crates along.
zip = { version = "9", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.25"
rar = "0.4"

# SVG. `resvg` is pure Rust with no C build; its `tiny-skia` pixel buffer is
# used through `resvg::tiny_skia` so the versions match what `resvg` expects.
# SVG is vector, so it renders at any target size — there is no `full` tier and
# no source-size decode: the preview is the decode.
resvg = "0.50"


[target.'cfg(windows)'.dependencies]
# `Win32_Security` and `Win32_System_IO` are not incidental: windows-sys gates
# functions on the features their *parameters* need, and `CreateFileW` takes a
# `SECURITY_ATTRIBUTES` while `ReadDirectoryChangesW` takes an `OVERLAPPED` —
# even though this code passes null for both. The same rule for the three below:
# `CoInitializeEx` lives in `Win32_System_Com`, `GetDIBits`/`GetObjectW` in
# `Win32_Graphics_Gdi`, and `SHCreateItemFromParsingName` in `Win32_UI_Shell` —
# the call that reads Explorer's thumbnail cache.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_UI_Shell",
] }

[dev-dependencies]
criterion = "0.8"
proptest = "1"
tempfile = "3"
# For the hand-built APNG fixture in tests/multiframe.rs: chunk CRCs and the
# zlib stream inside IDAT/fdAT. Both already in the tree via the `png` feature.
crc32fast = "1"
miniz_oxide = "0.9"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
strip = true        # Automatically strip symbols from the release binary.
opt-level = "z"     # Optimize for size instead of speed.
lto = true          # Link Time Optimization — removes dead code across crates.
codegen-units = 1   # Better cross-codegen-unit optimization; slower builds.


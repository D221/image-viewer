[package]
name = "image-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui = "0.27"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rfd = "0.17.2"
nom-exif = "3.8.0"
turbojpeg = "1"
trash = "5"
open = "5"
jxl-oxide = { version = "0.12", features = ["image"] }
heic = { version = "0.1.6", features = ["av1", "parallel"] }


[dev-dependencies]
criterion = "0.5"
proptest = "1"
tempfile = "3"
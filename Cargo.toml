[package]
name = "image-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.36"
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "ico", "tiff", "qoi", "rayon"] }
# PNG stores its iCCP profile zlib-compressed. Already in the tree via `png`,
# pure Rust (miniz_oxide), so this adds no native code.
flate2 = "1"
# Used directly by the linear-light resampler: the box pre-reduction and both
# kernel passes are row-parallel and were the hottest loops in the viewer.
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rfd = "0.17.2"
nom-exif = "3.8.0"
turbojpeg = "1"
trash = "5"
open = "5"
jxl-oxide = { version = "0.12", features = ["image"] }
heic = { version = "0.1.6", features = ["av1", "parallel"] }
# Multi-page TIFF. `image` 0.25 wraps this crate but exposes no way to reach page
# 2 - `TiffDecoder` implements only `ImageDecoder`, whose `read_image` consumes
# the decoder, and it is not an `AnimationDecoder`. So depending on it directly is
# the only way to see a multi-page TIFF's other pages. It was already in the tree
# transitively, so this adds no new download and no new native code.
tiff = "0.11"
arboard = "3"
wallpaper = "3"
winreg = "0.52"
# Archives (`.cbz`/`.zip`) are stored or deflated in the real world; the
# exotic codecs (bzip2, lzma, zstd, AES) would only matter for archives this
# viewer cannot open for other reasons (no password UI), and each carries its
# own subtree. A member using one fails extraction with a clear error instead
# of dragging 30 crates along.
zip = { version = "2", default-features = false, features = ["deflate"] }
pollster = "1.0.1"


[dev-dependencies]
criterion = "0.5"
proptest = "1"
tempfile = "3"
# For the hand-built APNG fixture in tests/multiframe.rs: chunk CRCs and the
# zlib stream inside IDAT/fdAT. Both already in the tree via the `png` feature.
crc32fast = "1"
miniz_oxide = "0.8"

[build-dependencies]
winresource = "0.1.31"

[package]
name = "image-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.36"
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "ico", "tiff", "rayon"] }
# PNG stores its iCCP profile zlib-compressed. Already in the tree via `png`,
# pure Rust (miniz_oxide), so this adds no native code.
flate2 = "1"
# Used directly by the linear-light resampler: the box pre-reduction and both
# kernel passes are row-parallel and were the hottest loops in the viewer.
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rfd = "0.17.2"
nom-exif = "3.8.0"
turbojpeg = "1"
trash = "5"
open = "5"
jxl-oxide = { version = "0.12", features = ["image"] }
heic = { version = "0.1.6", features = ["av1", "parallel"] }
arboard = "3"
wallpaper = "3"
winreg = "0.52"
zip = "2"


[dev-dependencies]
criterion = "0.5"
proptest = "1"
tempfile = "3"
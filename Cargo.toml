[package]
name = "image-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui = "0.27"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rfd = "0.17.2"
nom-exif = "3.8.0"
turbojpeg = "1"


[dev-dependencies]
criterion = "0.5"
proptest = "1"
tempfile = "3"